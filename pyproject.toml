[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafcode"
version = "0.1.0"
description = "🍃 Intelligent botanical AI terminal assistant CLI with multi-provider model integration and autonomous tool execution."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Hiro66-git", email = "hiro66@example.com" }
]
keywords = [
    "ai",
    "cli",
    "terminal",
    "assistant",
    "coding-assistant",
    "claude",
    "groq",
    "ollama",
    "gemini",
    "openai",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Terminals"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hiro66-git/nevertheless"
Repository = "https://github.com/Hiro66-git/nevertheless.git"
Issues = "https://github.com/Hiro66-git/nevertheless/issues"

[project.scripts]
leafcode = "leafcode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leafcode*"]
